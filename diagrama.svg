<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="100%">
  <rect width="600" height="280" fill="#0a0b0e"/>
  
  <!-- LÍNEAS DE CONEXIÓN -->
  <path d="M 300 70 L 110 140 M 300 70 L 300 140 M 300 70 L 490 140" stroke="#64748b" stroke-width="2" stroke-dasharray="4"/>
  
  <!-- NODO TEMA CENTRAL -->
  <g transform="translate(150, 20)">
    <rect width="300" height="50" rx="4" fill="#ccff00" stroke="#000" stroke-width="2"/>
    <text x="150" y="25" fill="#000" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle" letter-spacing="1">TESIS: LA FELICIDAD ES EVITAR EL DOLOR</text>
    <text x="150" y="40" fill="#000" font-family="sans-serif" font-size="10" text-anchor="middle">(Eudemonología en Schopenhauer)</text>
  </g>

  <!-- COLUMNA 1: SINTAXIS / ESTRUCTURA -->
  <g transform="translate(20, 130)">
    <rect width="170" height="125" rx="8" fill="#12141a" stroke="#ff4d00" stroke-width="1.5"/>
    <text x="85" y="25" fill="#ff4d00" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">ESTRATEGIA SINTÁCTICA</text>
    
    <rect x="10" y="38" width="150" height="35" rx="4" fill="#0a0b0e" stroke="#334155"/>
    <text x="85" y="52" fill="#ccff00" font-family="monospace" font-weight="bold" font-size="9" text-anchor="middle">Aforismos cortos</text>
    <text x="85" y="65" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Sentencias directas y pragmáticas</text>

    <rect x="10" y="80" width="150" height="35" rx="4" fill="#0a0b0e" stroke="#334155"/>
    <text x="85" y="94" fill="#ccff00" font-family="monospace" font-weight="bold" font-size="9" text-anchor="middle">Paralelismo antitético</text>
    <text x="85" y="107" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Contrapone placer vs. dolor</text>
  </g>

  <!-- COLUMNA 2: SEMÁNTICA Y METÁFORAS -->
  <g transform="translate(215, 130)">
    <rect width="170" height="125" rx="8" fill="#12141a" stroke="#ff4d00" stroke-width="1.5"/>
    <text x="85" y="25" fill="#ff4d00" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">RECURSOS SEMÁNTICOS</text>
    
    <rect x="10" y="38" width="150" height="35" rx="4" fill="#0a0b0e" stroke="#334155"/>
    <text x="85" y="52" fill="#ccff00" font-family="monospace" font-weight="bold" font-size="9" text-anchor="middle">Metáfora médica</text>
    <text x="85" y="65" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">La felicidad como "prevención"</text>

    <rect x="10" y="80" width="150" height="35" rx="4" fill="#0a0b0e" stroke="#334155"/>
    <text x="85" y="94" fill="#ccff00" font-family="monospace" font-weight="bold" font-size="9" text-anchor="middle">Personificación de la Voluntad</text>
    <text x="85" y="107" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">El deseo como fuerza ciega</text>
  </g>

  <!-- COLUMNA 3: TONO Y DISCURSO -->
  <g transform="translate(410, 130)">
    <rect width="170" height="125" rx="8" fill="#12141a" stroke="#ff4d00" stroke-width="1.5"/>
    <text x="85" y="25" fill="#ff4d00" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">TONO Y ARGUMENTACIÓN</text>
    
    <rect x="10" y="38" width="150" height="35" rx="4" fill="#0a0b0e" stroke="#334155"/>
    <text x="85" y="52" fill="#ccff00" font-family="monospace" font-weight="bold" font-size="9" text-anchor="middle">Ironía pesimista</text>
    <text x="85" y="65" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Desmitifica la búsqueda de placer</text>

    <rect x="10" y="80" width="150" height="35" rx="4" fill="#0a0b0e" stroke="#334155"/>
    <text x="85" y="94" fill="#ccff00" font-family="monospace" font-weight="bold" font-size="9" text-anchor="middle">Citas de autoridad</text>
    <text x="85" y="107" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Uso de estoicos (Séneca, Epicteto)</text>
  </g>
</svg>
