<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" style="background: #0a0b0e; border-radius: 12px; width: 100%; height: auto;">
  <!-- SÍMBOLO 1: BALANZA MODERNA -->
  <g transform="translate(0, 0)">
    <line x1="150" y1="50" x2="150" y2="150" stroke="#ccff00" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="70" x2="190" y2="70" stroke="#ccff00" stroke-width="2" stroke-linecap="round"/>
    <path d="M 110 70 L 95 120 L 125 120 Z" fill="none" stroke="#ccff00" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 190 70 L 175 110 L 205 110 Z" fill="none" stroke="#ccff00" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="150" cy="50" r="4" fill="#ccff00"/>
  </g>

  <!-- SÍMBOLO 2: NÚCLEO / LENTE GEOMÉTRICA -->
  <g transform="translate(0, 0)">
    <circle cx="400" cy="100" r="40" fill="none" stroke="#ff4d00" stroke-width="2"/>
    <circle cx="400" cy="100" r="20" fill="none" stroke="#ff4d00" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="400" cy="100" r="6" fill="#ff4d00"/>
    <line x1="400" y1="40" x2="400" y2="60" stroke="#ff4d00" stroke-width="2"/>
    <line x1="400" y1="140" x2="400" y2="160" stroke="#ff4d00" stroke-width="2"/>
  </g>

  <!-- SÍMBOLO 3: BRÚJULA / ORIENTACIÓN CRÍTICA -->
  <g transform="translate(0, 0)">
    <circle cx="650" cy="100" r="40" fill="none" stroke="#ffb703" stroke-width="2"/>
    <polygon points="650,65 660,100 650,135 640,100" fill="#ffb703" opacity="0.9"/>
    <polygon points="615,100 650,110 685,100 650,90" fill="#ffb703" opacity="0.4"/>
    <circle cx="650" cy="100" r="3" fill="#0a0b0e"/>
  </g>
</svg>
